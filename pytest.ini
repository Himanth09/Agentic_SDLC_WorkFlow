[pytest]
# Run only the agentic system's own test suite when pytest is started from the repo root.
# Generated projects under runs/ and the sample repo under examples/ each ship their own
# top-level "tests" package; collecting them together causes import clashes.
testpaths = agentic-sdlc/agentic-sdlc/tests
pythonpath = agentic-sdlc/agentic-sdlc
norecursedirs = runs examples .git __pycache__ .pytest_cache
markers =
    e2e: full workflow runs (slower, ~2s each)
